name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===== Updating Repository ====="
            cd /var/www/Incentive_claim

            git fetch --all
            git reset --hard origin/main
            git clean -fd

            echo "===== Deploying FastAPI Backend ====="
            cd backend

            mkdir -p uploads

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            pip install --upgrade pip
            pip install -r requirements.txt

            echo "===== Configuring & Restarting FastAPI Systemd Service ====="
            echo "[Unit]
            Description=FastAPI Backend Service
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/var/www/Incentive_claim/backend
            EnvironmentFile=/var/www/Incentive_claim/backend/.env
            ExecStart=/var/www/Incentive_claim/backend/venv/bin/gunicorn -c gunicorn.conf.py app.main:app
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target" | sudo tee /etc/systemd/system/fastapi.service > /dev/null

            sudo systemctl daemon-reload
            sudo systemctl enable fastapi
            sudo systemctl restart fastapi || sudo systemctl restart portal-backend || true

            echo "===== Building Frontend Production Static Files ====="
            cd ../frontend

            rm -rf dist node_modules/.vite

            npm ci
            npm run build

            echo "===== Restarting Nginx ====="
            sudo nginx -t
            sudo systemctl reload nginx || sudo systemctl restart nginx

            echo "===== Deployment Successful ====="