name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===== Updating Repository ====="
            cd /var/www/Incentive_claim
            git fetch --all
            git reset --hard origin/main

            echo "===== Deploying Backend ====="
            cd /var/www/Incentive_claim/backend
            mkdir -p uploads
            if [ ! -d "venv" ]; then python3 -m venv venv; fi
            source venv/bin/activate
            pip install -r requirements.txt

            echo "===== Configuring FastAPI Service ====="
            printf "[Unit]\nDescription=FastAPI Backend Service\nAfter=network.target\n\n[Service]\nUser=ubuntu\nWorkingDirectory=/var/www/Incentive_claim/backend\nEnvironmentFile=-/var/www/Incentive_claim/backend/.env\nExecStart=/var/www/Incentive_claim/backend/venv/bin/gunicorn -c gunicorn.conf.py app.main:app\nRestart=always\nRestartSec=3\nTimeoutStopSec=5\n\n[Install]\nWantedBy=multi-user.target\n" | sudo tee /etc/systemd/system/fastapi.service > /dev/null

            sudo systemctl daemon-reload
            sudo systemctl enable fastapi
            sudo systemctl restart fastapi || true
            sudo chmod -R 755 /var/www/Incentive_claim/backend/uploads || true

            echo "===== Building Frontend Static Files ====="
            cd /var/www/Incentive_claim/frontend
            npm install --no-audit --no-fund
            chmod -R +x node_modules/.bin || true
            npm run build
            sudo chmod -R 755 /var/www/Incentive_claim/frontend/dist || true

            echo "===== Configuring Nginx Site ====="
            printf 'server {\n    listen 80 default_server;\n    listen [::]:80 default_server;\n    server_name _;\n    root /var/www/Incentive_claim/frontend/dist;\n    index index.html;\n    client_max_body_size 50M;\n\n    location / {\n        try_files $uri $uri/ /index.html;\n    }\n\n    location /api/ {\n        proxy_pass http://127.0.0.1:8000/api/;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection "upgrade";\n        proxy_set_header Host $host;\n        proxy_cache_bypass $http_upgrade;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n\n    location ~ ^/(docs|redoc|openapi.json) {\n        proxy_pass http://127.0.0.1:8000;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n\n    location /uploads/ {\n        proxy_pass http://127.0.0.1:8000/uploads/;\n    }\n}\n' | sudo tee /etc/nginx/sites-available/default > /dev/null

            echo "===== Reloading Nginx ====="
            sudo nginx -t
            sudo systemctl reload nginx || sudo systemctl restart nginx

            echo "===== Deployment Successful ====="