name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===== Updating Repository ====="
            cd /var/www/Incentive_claim
            git fetch --all
            git reset --hard origin/main

            echo "===== Deploying Backend ====="
            cd /var/www/Incentive_claim/backend
            mkdir -p uploads
            if [ ! -d "venv" ]; then python3 -m venv venv; fi
            source venv/bin/activate
            pip install -r requirements.txt

            echo "===== Configuring FastAPI Service ====="
            printf "[Unit]\nDescription=FastAPI Backend Service\nAfter=network.target\n\n[Service]\nUser=ubuntu\nWorkingDirectory=/var/www/Incentive_claim/backend\nEnvironmentFile=-/var/www/Incentive_claim/backend/.env\nExecStart=/var/www/Incentive_claim/backend/venv/bin/gunicorn -c gunicorn.conf.py app.main:app\nRestart=always\nRestartSec=3\nTimeoutStopSec=5\n\n[Install]\nWantedBy=multi-user.target\n" | sudo tee /etc/systemd/system/fastapi.service > /dev/null

            sudo systemctl daemon-reload
            sudo systemctl enable fastapi
            sudo systemctl restart fastapi || true
            sudo chmod -R 755 /var/www/Incentive_claim/backend/uploads || true

            echo "===== Building Frontend Static Files ====="
            cd /var/www/Incentive_claim/frontend
            npm install --no-audit --no-fund
            chmod -R +x node_modules/.bin || true
            npm run build
            sudo chmod -R 755 /var/www/Incentive_claim/frontend/dist || true

            echo "===== Reloading Nginx ====="
            sudo nginx -t
            sudo systemctl reload nginx || sudo systemctl restart nginx

            echo "===== Deployment Successful ====="